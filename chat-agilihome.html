<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EA580C">
<title>agilihome Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff}
#app{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hi{display:none!important}
/* LOGIN */
#tela-login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px 24px}
.lg-logo{width:80px;height:80px;margin-bottom:14px}
.lg-marca{font-size:24px;font-weight:800;margin-bottom:3px}
.lg-sub{font-size:12px;color:#94A3B8;margin-bottom:32px;text-align:center;line-height:1.6}
.lg-card{background:#F8FAFC;border-radius:16px;padding:20px;width:100%;max-width:360px;border:1px solid #E2E8F0}
.lg-av{width:48px;height:48px;border-radius:50%;background:#EA580C;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.lg-cn{font-size:16px;font-weight:700;color:#0F172A;text-align:center;margin-bottom:2px}
.lg-cc{font-size:11px;color:#475569;text-align:center;margin-bottom:16px}
.lg-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94A3B8;margin-bottom:6px;display:block}
.lg-inp{width:100%;padding:12px 14px;background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;font-size:16px;color:#0F172A;outline:none;margin-bottom:12px;font-family:inherit;transition:border-color .15s}
.lg-inp:focus{border-color:#EA580C}
.lg-inp::placeholder{color:#94A3B8}
.lg-btn{width:100%;padding:14px;background:#EA580C;border:none;border-radius:12px;font-size:15px;font-weight:700;color:#fff;cursor:pointer}
.lg-btn:active{background:#C2410C}
.lg-err{color:#EF4444;font-size:12px;margin-top:-6px;margin-bottom:10px;display:none}
.lg-back{background:none;border:none;color:#94A3B8;font-size:13px;margin-top:12px;cursor:pointer;width:100%}
.lg-loading{text-align:center;padding:20px;color:#94A3B8;font-size:13px}

/* TELA MAIN — layout fixo em colunas */
#tela-main{display:flex;flex-direction:column;height:100%;overflow:hidden}
.hdr{background:#EA580C;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-t{font-size:18px;font-weight:700;flex:1}
.hdr-i{color:rgba(255,255,255,.8);font-size:20px;padding:4px;cursor:pointer;background:none;border:none}
.search-bar{margin:8px 12px;background:#F1F5F9;border-radius:22px;padding:9px 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:#94A3B8;flex-shrink:0}
.filters{display:flex;gap:6px;padding:4px 12px 8px;flex-shrink:0}
.flt{padding:5px 14px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:background .15s}
.flt-a{background:#EA580C;color:#fff}
.flt-i{background:#F1F5F9;color:#475569}
/* LISTA ROLA, o resto não */
#lista-conv{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cv{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #F1F5F9;cursor:pointer}
.cv:active{background:#F8FAFC}
.cv-a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;overflow:hidden}
.cv-a img{width:100%;height:100%;object-fit:cover}
.cv-b{flex:1;min-width:0}
.cv-tp{display:flex;justify-content:space-between;align-items:baseline}
.cv-n{font-size:14.5px;font-weight:700;color:#0F172A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-t{font-size:11px;color:#94A3B8;flex-shrink:0}
.cv-tu{font-size:11px;color:#EA580C;font-weight:600;flex-shrink:0}
.cv-p{font-size:12.5px;color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.cv-bg{min-width:20px;height:20px;border-radius:10px;background:#EA580C;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}

/* FAB — posicionado acima do bnav fixo */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);right:calc(50% - 215px + 16px);width:50px;height:50px;border-radius:50%;background:#EA580C;border:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(234,88,12,.4);cursor:pointer;z-index:10}
.fab:active{transform:scale(.93)}
@media(max-width:430px){.fab{right:16px}}

/* BOTTOM NAV — sempre fixo */
.bnav{display:flex;background:#fff;border-top:1px solid #E2E8F0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 10px);flex-shrink:0}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#94A3B8;cursor:pointer;border:none;background:none}
.nb.active{color:#EA580C}
.nb svg{width:26px;height:26px}

/* TELA CHAT — cobre tudo */
#tela-chat{flex-direction:column;height:100%;position:absolute;inset:0;z-index:20;background:#fff}
.ch-hdr{background:#C2410C;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.ch-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px}
.ch-av{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px;overflow:hidden;flex-shrink:0}
.ch-av img{width:100%;height:100%;border-radius:50%}
.ch-info{flex:1;min-width:0}
.ch-nm{font-size:15px;font-weight:700;color:#fff}
.ch-sb{font-size:11px;color:rgba(255,255,255,.55)}
.ch-hdr-i{color:rgba(255,255,255,.7);font-size:18px;padding:4px;background:none;border:none;cursor:pointer}
#msgs-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#F0F4F8;display:flex;flex-direction:column;gap:2px}
.date-sep{align-self:center;background:rgba(148,163,184,.25);border-radius:8px;padding:3px 10px;font-size:10px;color:#475569;margin:6px 0}
.msg{max-width:78%;border-radius:14px;padding:8px 12px;font-size:13.5px;line-height:1.5;margin-bottom:1px}
.msg-in{align-self:flex-start;background:#fff;border:1px solid #E2E8F0;color:#0F172A;border-bottom-left-radius:4px}
.msg-out{align-self:flex-end;background:#EA580C;color:#fff;border-bottom-right-radius:4px}
.msg-formal{align-self:flex-start;background:#FFF7ED;border:2px solid #EA580C;color:#0F172A;border-bottom-left-radius:4px}
.msg-ft{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:#EA580C;color:#fff;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:3px}
.msg-au{font-size:10px;font-weight:600;color:#EA580C;margin-bottom:2px}
.msg-tm{font-size:9px;color:#94A3B8;margin-top:2px;text-align:right}
.msg-tmo{font-size:9px;color:rgba(255,255,255,.65);margin-top:2px;text-align:right}
.input-area{padding:8px 10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:#fff;border-top:1px solid #E2E8F0;display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.in-txt{flex:1;background:#F1F5F9;border:1.5px solid #E2E8F0;border-radius:22px;padding:9px 14px;font-size:16px;color:#0F172A;outline:none;resize:none;max-height:100px;line-height:1.4;font-family:inherit;transition:border-color .15s}
.in-txt:focus{border-color:#EA580C}
.in-txt::placeholder{color:#94A3B8}
.in-send{width:38px;height:38px;border-radius:50%;background:#EA580C;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.in-send:active{background:#C2410C;transform:scale(.93)}

/* MODAL GRUPO */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:430px;max-height:85vh;display:flex;flex-direction:column;gap:14px}
.modal-title{font-size:16px;font-weight:800;color:#0F172A}
.modal-inp{width:100%;padding:12px 14px;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:10px;font-size:15px;color:#0F172A;outline:none;font-family:inherit}
.modal-inp:focus{border-color:#EA580C}
.modal-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94A3B8;margin-bottom:4px}
.membros-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.membro-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#F8FAFC;cursor:pointer}
.membro-item.sel{background:#FFF7ED;border:1.5px solid #EA580C}
.membro-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.membro-nome{font-size:13px;font-weight:600;color:#0F172A;flex:1}
.membro-chk{width:20px;height:20px;border-radius:50%;border:2px solid #E2E8F0;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.membro-item.sel .membro-chk{background:#EA580C;border-color:#EA580C;color:#fff}
.modal-actions{display:flex;gap:10px}
.btn-cancel{flex:1;padding:12px;border-radius:12px;border:1.5px solid #E2E8F0;background:#fff;font-size:14px;font-weight:600;color:#475569;cursor:pointer}
.btn-criar{flex:2;padding:12px;border-radius:12px;border:none;background:#EA580C;font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.btn-criar:active{background:#C2410C}

/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;white-space:nowrap;animation:ti .25s ease;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.in-formal{background:none;border:none;font-size:20px;color:#94A3B8;cursor:pointer;padding:6px;border-radius:8px}
.in-formal.active{color:#EA580C}
.msg-formal-out{align-self:flex-end;background:#FFF7ED;border:2px solid #EA580C;color:#0F172A;border-bottom-right-radius:4px}
.msg-formal-in{align-self:flex-start;background:#FFF7ED;border:2px solid #EA580C;color:#0F172A;border-bottom-left-radius:4px}

.cv-badge{min-width:20px;height:20px;border-radius:10px;background:#EA580C;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div id="app">

<!-- LOGIN -->
<div id="tela-login">
  <img class="lg-logo" src="icon-192.png" alt="agilihome">
  <div class="lg-marca"><span style="color:#6B7280">agili</span><span style="color:#EA580C">home</span></div>
  <div class="lg-sub">Chat interno da rede<br>Registro formal de conversas</div>
  <div class="lg-card" id="step-token">
    <label class="lg-lbl">Token de acesso</label>
    <input class="lg-inp" id="in-token" type="text" placeholder="Ex: ADM-MARCO" autocomplete="off" autocapitalize="characters" spellcheck="false" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')stepToken()">
    <div class="lg-err" id="err-token">Token não reconhecido.</div>
    <button class="lg-btn" onclick="stepToken()">Continuar</button>

  </div>
  <div class="lg-card hi" id="step-register">
    <div class="lg-av" id="reg-av"></div>
    <div class="lg-cn" id="reg-nome"></div>
    <div class="lg-cc" id="reg-cargo"></div>
    <label class="lg-lbl">Criar senha para este dispositivo</label>
    <input class="lg-inp" id="in-senha-nova" type="password" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')registrar()">
    <div class="lg-err" id="err-reg">Senha deve ter pelo menos 6 caracteres.</div>
    <button class="lg-btn" onclick="registrar()">Registrar dispositivo</button>
    <button class="lg-back" onclick="voltarToken()">Voltar</button>
  </div>
  <div class="lg-card hi" id="step-login">
    <div class="lg-av" id="log-av"></div>
    <div class="lg-cn" id="log-nome"></div>
    <div class="lg-cc" id="log-cargo"></div>
    <label class="lg-lbl">Senha</label>
    <input class="lg-inp" id="in-senha" type="password" placeholder="......" onkeydown="if(event.key==='Enter')logar()">
    <div class="lg-err" id="err-log">Senha incorreta.</div>
    <button class="lg-btn" onclick="logar()">Entrar</button>
    <button class="lg-back" onclick="voltarToken()">Outro token</button>
  </div>
  <div class="lg-loading hi" id="step-loading">Conectando...</div>
</div>

<!-- TELA PRINCIPAL -->
<div id="tela-main" class="hi">
  <div class="hdr">
    <img src="icon-192.png" alt="" style="width:30px;height:30px;border-radius:7px;background:#fff;padding:2px;object-fit:cover">
    <div class="hdr-t"><span style="color:#4B5563">agili</span><span style="color:#fff">home</span></div>
    <button class="hdr-i" onclick="toggleSearch()">&#128269;</button>
    <button class="hdr-i" onclick="logout()">&#8942;</button>
  </div>
  <div class="search-bar hi" id="search-bar">
    <span>&#128269;</span>
    <input type="text" placeholder="Pesquisar conversas..." id="in-search" style="border:none;background:none;outline:none;font-size:13px;color:#0F172A;flex:1;font-family:inherit" oninput="filtrarConversas(this.value)">
  </div>
  <div class="filters">
    <button class="flt flt-a" onclick="filtrar('todos',this)">Todas</button>
    <button class="flt flt-i" onclick="filtrar('grupos',this)">Grupos</button>
    <button class="flt flt-i" onclick="filtrar('equipe',this)">Equipe</button>
    <button class="flt flt-i" onclick="filtrar('franqueados',this)">Franqueados</button>
  </div>
  <!-- LISTA ROLA -->
  <div id="lista-conv"></div>
  <!-- FAB -->
  <button class="fab" onclick="abrirModalGrupo()">+</button>
  <!-- BOTTOM NAV FIXO -->
  <div class="bnav">
    <button class="nb active" id="nb-conv" onclick="navTab('conv')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span>Conversas</span>
    </button>

    <button class="nb" id="nb-perf" onclick="navTab('perf')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </button>
  </div>
</div>

<!-- TELA CHAT -->
<div id="tela-chat" class="hi">
  <div class="ch-hdr">
    <button class="ch-back" onclick="voltarLista()">&#8592;</button>
    <div class="ch-av" id="ch-avatar"></div>
    <div class="ch-info"><div class="ch-nm" id="ch-nome"></div><div class="ch-sb" id="ch-sub"></div></div>
    <!-- telefone REMOVIDO -->
    <button class="ch-hdr-i">&#8942;</button>
  </div>
  <div id="msgs-area"></div>
  <div class="input-area">
    <button class="in-formal hi" id="btn-formal" onclick="toggleFormal()">&#9878;</button>
    <textarea class="in-txt" id="in-msg" placeholder="Mensagem..." rows="1" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"></textarea>
    <button class="in-send" onclick="enviar()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>

<!-- MODAL CRIAR GRUPO -->
<div class="modal-bg hi" id="modal-grupo">
  <div class="modal">
    <div class="modal-title">Criar novo grupo</div>
    <div>
      <div class="modal-label">Nome do grupo</div>
      <input class="modal-inp" id="grupo-nome" type="text" placeholder="Ex: Expansão Norte" maxlength="40">
    </div>
    <div>
      <div class="modal-label" style="margin-bottom:8px">Membros</div>
      <div class="membros-list" id="membros-list"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModalGrupo()">Cancelar</button>
      <button class="btn-criar" onclick="criarGrupo()">Criar grupo</button>
    </div>
  </div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
'use strict';
var CFG={apiKey:"AIzaSyAUisja7Cs0seHBPmkHqDpqXqyUSmSEylw",authDomain:"agilihome-sistema.firebaseapp.com",databaseURL:"https://agilihome-sistema-default-rtdb.firebaseio.com",projectId:"agilihome-sistema",storageBucket:"agilihome-sistema.firebasestorage.app",messagingSenderId:"518688420391",appId:"1:518688420391:web:681ff95e28562c30d31402"};
firebase.initializeApp(CFG);
var auth=firebase.auth(), db=firebase.database();
var LOGO32="icon-192.png"; // URL direta

var USERS={'ADM-PHILLIPE':{nome:'Phillipe de Paula',cargo:'Administrador',tipo:'admin',cor:'#1E40AF'},'ADM-JOAO':{nome:'João Gabriel',cargo:'Administrador',tipo:'admin',cor:'#16A34A'},'ADM-MARCO':{nome:'Marco Antonio',cargo:'Administrador',tipo:'admin',cor:'#EA580C'}};
function tokenEmail(tk){return tk.toLowerCase().replace(/\s/g,'')+'@agilihome.app'}
function ini(n){return n.split(' ').map(function(x){return x[0]}).slice(0,2).join('').toUpperCase()}
var SESSAO=null,CONV=null,FORMAL=false,_filtro='todos',_tk=null,_refs=[];
function $(id){return document.getElementById(id)}
function ts(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500)}

/* ── NOTIFICAÇÕES ── */
var _notifPerm=false;
function pedirNotificacao(){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted'){_notifPerm=true;return;}
  if(Notification.permission!=='denied'){
    Notification.requestPermission().then(function(p){_notifPerm=(p==='granted');});
  }
}
function notificar(titulo,corpo){
  // Som sempre que app estiver aberto
  tocarSom();
  // Badge no título
  incrementarBadge();
  // Notificação nativa (app em segundo plano)
  if(_notifPerm&&document.visibilityState!=='visible'){
    try{
      // Tenta via Service Worker (melhor suporte iOS PWA)
      if(window._swReg&&window._swReg.showNotification){
        window._swReg.showNotification(titulo,{body:corpo,icon:'icon-192.png',badge:'icon-192.png',tag:'agili-msg',renotify:true,vibrate:[200,100,200]});
      } else {
        new Notification(titulo,{body:corpo,icon:'icon-192.png',badge:'icon-192.png',tag:'agili-msg',renotify:true});
      }
    }catch(e){}
  }
}

/* ── LOGIN ── */
function stepToken(){
  var tk=$('in-token').value.trim().toUpperCase();
  var u=USERS[tk];
  if(!u){$('err-token').style.display='block';return}
  $('err-token').style.display='none';
  _tk=tk;
  $('step-token').classList.add('hi');
  showStep('step-login',u,'in-senha');
}
function showStep(stepId,u,focusId){
  var prefix=stepId==='step-login'?'log':'reg';
  $(prefix+'-av').textContent=ini(u.nome);$(prefix+'-av').style.background=u.cor;
  $(prefix+'-nome').textContent=u.nome;$(prefix+'-cargo').textContent=u.cargo;
  $(stepId).classList.remove('hi');
  setTimeout(function(){if($(focusId))$(focusId).focus()},80);
}
function registrar(){
  var s=$('in-senha-nova')?$('in-senha-nova').value:'';
  if(!s||s.length<6){$('err-reg').style.display='block';return}
  $('err-reg').style.display='none';
  auth.createUserWithEmailAndPassword(tokenEmail(_tk),s).then(function(c){
    var u=USERS[_tk];
    db.ref('usuarios/'+c.user.uid).set({token:_tk,nome:u.nome,cargo:u.cargo,tipo:u.tipo,cor:u.cor,criadoEm:new Date().toISOString()});
    entrarNoApp(c.user.uid);
  }).catch(function(e){
    $('err-reg').style.display='block';
    $('err-reg').textContent=e.code==='auth/email-already-in-use'?'Token já registrado. Use a senha.':e.message;
  });
}
function logar(){
  var s=$('in-senha')?$('in-senha').value:'';
  if(!s||s.length<6){$('err-log').style.display='block';$('err-log').textContent='Mínimo 6 caracteres.';return}
  $('err-log').style.display='none';
  var email=tokenEmail(_tk);
  // Tenta login primeiro
  auth.signInWithEmailAndPassword(email,s).then(function(cr){
    entrarNoApp(cr.user.uid);
  }).catch(function(e1){
    var novoCodigo=(e1.code==='auth/user-not-found'||e1.code==='auth/invalid-credential'||e1.code==='auth/invalid-login-credentials');
    if(novoCodigo){
      // Usuário não existe — cria
      auth.createUserWithEmailAndPassword(email,s).then(function(cr){
        var u=USERS[_tk];
        db.ref('usuarios/'+cr.user.uid).set({token:_tk,nome:u.nome,cargo:u.cargo,tipo:u.tipo,cor:u.cor,criadoEm:new Date().toISOString()});
        entrarNoApp(cr.user.uid);
      }).catch(function(e2){
        if(e2.code==='auth/email-already-in-use'){
          // Já existe mas senha errada
          $('err-log').style.display='block';
          $('err-log').textContent='Senha incorreta. Tente outra senha.';
        } else {
          $('err-log').style.display='block';
          $('err-log').textContent='Erro: '+e2.message;
        }
      });
    } else if(e1.code==='auth/wrong-password'){
      $('err-log').style.display='block';
      $('err-log').textContent='Senha incorreta.';
    } else {
      $('err-log').style.display='block';
      $('err-log').textContent='Erro: '+e1.code;
    }
  });
}
function voltarToken(){

function entrarNoApp(uid){
  var u=USERS[_tk];
  SESSAO={token:_tk,uid:uid,nome:u.nome,cargo:u.cargo,tipo:u.tipo,cor:u.cor};
  $('tela-login').style.display='none';
  var tm=$('tela-main');tm.classList.remove('hi');tm.style.display='flex';tm.style.flexDirection='column';
  db.ref('status/'+uid).set({token:_tk,nome:u.nome,online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});
  db.ref('status/'+uid).onDisconnect().set({token:_tk,nome:u.nome,online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
  criarGruposPadrao();
  renderLista();
  pedirNotificacao();
  if(SESSAO.tipo==='admin'){var bf=$('btn-formal');if(bf)bf.classList.remove('hi');}

function logout(){
  if(!confirm('Sair da conta?'))return;
  if(SESSAO)db.ref('status/'+SESSAO.uid).update({online:false});
  auth.signOut();SESSAO=null;CONV=null;
  _refs.forEach(function(fn){fn()});_refs=[];
  $('tela-main').style.display='none';
  $('tela-chat').classList.add('hi');$('tela-chat').style.display='none';
  $('step-token').classList.remove('hi');
  ['step-register','step-login'].forEach(function(s){$(s).classList.add('hi')});
  $('in-token').value='';$('tela-login').style.display='flex';

function renderLista(){

  lista.innerHTML='<div style="text-align:center;padding:20px;color:#94A3B8;font-size:13px">Carregando...</div>';
  db.ref('grupos').on('value',function(snap){
    var grupos=snap.val()||{};
    var html='';
    Object.keys(grupos).forEach(function(id){
      var g=grupos[id];
      if(_filtro==='grupos'&&g.tipo!=='grupo')return;
      if(_filtro==='equipe'&&g.tipo!=='direto')return;
      var isLogo=(id==='g_rede');
      var avInner=isLogo?'<img src="icon-192.png" alt="" style="width:100%;height:100%;object-fit:cover">':ini(g.nome);
      var avSt=isLogo?'background:#fff;border:2px solid #EA580C':'background:'+g.cor;
      html+='<div class="cv" data-canal="'+id+'" data-nome="'+g.nome+'" data-cor="'+g.cor+'" data-tipo="'+g.tipo+'">';
      html+='<div class="cv-a" style="'+avSt+'">'+avInner+'</div>';
      html+='<div class="cv-b"><div class="cv-tp"><div class="cv-n">'+g.nome+'</div>';
      html+='<div style="display:flex;align-items:center;gap:6px"><div class="cv-badge" id="badge_'+id+'" style="display:none">1</div><div class="cv-t" id="t_'+id+'"></div></div></div>';
      html+='<div class="cv-p" id="p_'+id+'">...</div></div></div>';
    });
    if(SESSAO.tipo==='admin'&&(_filtro==='todos'||_filtro==='equipe')){
      Object.keys(USERS).forEach(function(tk){
        var u=USERS[tk];
        if(u.tipo==='comercial'){
          var cid='dir_'+[SESSAO.token,tk].sort().join('_');
          html+='<div class="cv" data-canal="'+cid+'" data-nome="'+u.nome+'" data-cor="'+u.cor+'" data-tipo="direto">';
          html+='<div class="cv-a" style="background:'+u.cor+'">'+ini(u.nome)+'</div>';
          html+='<div class="cv-b"><div class="cv-tp"><div class="cv-n">'+u.nome+'</div>';
          html+='<div class="cv-t" id="t_'+cid+'"></div></div>';
          html+='<div class="cv-p" id="p_'+cid+'">Conversa direta</div></div></div>';
        }
      });
    }
    // Diretos entre admins
    if(_filtro==='todos'||_filtro==='equipe'){
      Object.keys(USERS).forEach(function(tk){
        if(tk===SESSAO.token)return;
        var u=USERS[tk];
        var cid='dir_'+[SESSAO.token,tk].sort().join('_');
        html+='<div class="cv" data-canal="'+cid+'" data-nome="'+u.nome+'" data-cor="'+u.cor+'" data-tipo="direto">';
        html+='<div class="cv-a" style="background:'+u.cor+'">'+ini(u.nome)+'</div>';
        html+='<div class="cv-b"><div class="cv-tp"><div class="cv-n">'+u.nome+'</div>';
        html+='<div style="display:flex;align-items:center;gap:6px"><div class="cv-badge" id="badge_'+cid+'" style="display:none">1</div><div class="cv-t" id="t_'+cid+'"></div></div></div>';
        html+='<div class="cv-p" id="p_'+cid+'">Conversa direta</div></div></div>';
      });
    }
    lista.innerHTML=html||'<div style="text-align:center;padding:40px;color:#94A3B8;font-size:13px">Nenhuma conversa</div>';
    Object.keys(grupos).forEach(function(id){
      db.ref('mensagens/'+id).limitToLast(1).on('value',function(ms){
        var msgs=ms.val();if(!msgs)return;
        var m=Object.values(msgs)[0];
        var pEl=document.getElementById('p_'+id);
        var tEl=document.getElementById('t_'+id);
        if(pEl)pEl.textContent=(m.formal?'📢 ':'')+m.autorNome.split(' ')[0]+': '+m.texto.slice(0,40);
        if(tEl)tEl.textContent=m.hora||'';

        var lastVisto=parseInt(localStorage.getItem('visto_'+id)||'0');
        var badgeEl=document.getElementById('badge_'+id);
        if(badgeEl){
          if(m.timestamp&&m.timestamp>lastVisto&&m.autorToken!==SESSAO.token){
            badgeEl.style.display='flex';
          } else {
            badgeEl.style.display='none';
          }
        }
      });
    });
  });

var _ultimoTs=Date.now();
function escutarNovasMensagens(){
  // Escuta grupos padrão + diretos do usuário
  var canais=['g_rede','g_consul','g_ops'];
  // diretos com outros admins
  Object.keys(USERS).forEach(function(tk){
    if(tk!==SESSAO.token)
      canais.push('dir_'+[SESSAO.token,tk].sort().join('_'));
  });
  canais.forEach(function(canal){
    var ref=db.ref('mensagens/'+canal).orderByChild('timestamp').startAt(_ultimoTs+1);
    ref.on('child_added',function(snap){
      var m=snap.val();
      if(!m||m.autorToken===SESSAO.token)return;
      // Só notifica se não está olhando este canal agora
      if(!CONV||CONV.canal!==canal){
        notificar('agilihome · '+(m.formal?'Ato Formal':'Nova mensagem'),m.autorNome.split(' ')[0]+': '+m.texto.slice(0,80));

      }
    });
  });
}

function abrirChat(canal,nome,cor,tipo){
  CONV={canal:canal,nome:nome,cor:cor,tipo:tipo};
  localStorage.setItem('visto_'+canal, Date.now());
  var badgeEl=document.getElementById('badge_'+canal);
  if(badgeEl)badgeEl.style.display='none';
  limparBadge();
  var av=$('ch-avatar');
  if(canal==='g_rede'){
    av.innerHTML='<img src="icon-192.png" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
    av.style.background='#fff';
  }else{
    av.style.background=cor;
    av.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;border-radius:50%">'+ini(nome)+'</div>';
  }
  $('ch-nome').textContent=nome;
  $('ch-sub').textContent=(tipo==='grupo')?'Grupo':'Conversa direta';
  var tc=$('tela-chat');tc.classList.remove('hi');tc.style.display='flex';tc.style.flexDirection='column';
  var area=$('msgs-area');
  area.innerHTML='<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:13px">Carregando...</div>';
  _refs.forEach(function(fn){fn()});_refs=[];
  var ref=db.ref('mensagens/'+canal).limitToLast(100);
  var handler=ref.on('value',function(snap){
    var msgs=snap.val();
    if(!msgs){area.innerHTML='<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:13px">Nenhuma mensagem ainda</div>';return}
    var html='',lastD='';
    Object.values(msgs).forEach(function(m){
      var d=m.data||'';
      if(d!==lastD){lastD=d;html+='<div class="date-sep">'+(d===new Date().toLocaleDateString('pt-BR')?'Hoje':d)+'</div>';}
      var mine=(m.autorToken===SESSAO.token);
      var cls=m.formal?(mine?'msg msg-formal-out':'msg msg-formal-in'):(mine?'msg msg-out':'msg msg-in');
      html+='<div class="'+cls+'">';
      if(m.formal){
        html+='<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px">';
        html+='<span style="background:#EA580C;color:#fff;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px">&#9878; Comunicado Oficial</span>';
        html+='</div>';
        if(!mine)html+='<div style="font-size:10px;font-weight:600;color:#C2410C;margin-bottom:4px">'+m.autorNome+'</div>';
        html+='<div style="font-size:13.5px;line-height:1.5;color:#0F172A">'+m.texto+'</div>';
      } else {
        if(!mine)html+='<div class="msg-au">'+m.autorNome+'</div>';
        html+=m.texto;
      }
      html+='<div style="font-size:9px;margin-top:2px;text-align:right;color:'+(mine?'#94A3B8':'#94A3B8')+'">'+(m.hora||'')+(mine?' &#10003;&#10003;':'')+'</div></div>';
    });
    area.innerHTML=html;
    setTimeout(function(){area.scrollTop=area.scrollHeight},30);
  });
  _refs.push(function(){ref.off('value',handler)});
  if($('in-msg'))$('in-msg').focus();
}

/* ── SOM DE NOTIFICAÇÃO ── */
function tocarSom(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator();
    var g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(880,ctx.currentTime);
    o.frequency.setValueAtTime(660,ctx.currentTime+0.1);
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);
  }catch(e){}
}
/* Desbloquear AudioContext no primeiro toque */
document.addEventListener('touchstart',function desbloq(){
  try{var ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(e){}
  document.removeEventListener('touchstart',desbloq);
},{once:true});

/* ── FCM PUSH NOTIFICATIONS ── */
var FCM_VAPID='BNHCHKb8AKd3bL5T8X_4D0g9bj4Z4iZRoDtQt4RjE8psDThDg1AYRlUMhEeHbTg8ZQEt_Wy1fh_Ep-9eH4PpvKE'; // placeholder — substituir
var _fcmToken=null;
function iniciarFCM(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    console.log('Push não suportado neste browser');return;
  }
  navigator.serviceWorker.register('/agilihome/sw.js').then(function(reg){
    window._swReg=reg;
    console.log('SW registrado');
    // Verificar se já tem assinatura
    return reg.pushManager.getSubscription().then(function(sub){
      if(sub){return sub;}
      // Criar nova assinatura com a chave VAPID
      return reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(FCM_VAPID)
      });
    });
  }).then(function(sub){
    if(!sub)return;
    _fcmToken=JSON.stringify(sub);
    salvarTokenFCM();
    console.log('Push subscription ativa');
  }).catch(function(e){console.log('FCM erro:',e);});
}
function salvarTokenFCM(){
  if(!SESSAO||!_fcmToken)return;
  db.ref('fcm_tokens/'+SESSAO.token).set({
    subscription:_fcmToken,
    ua:navigator.userAgent,
    ts:Date.now(),
    nome:SESSAO.nome
  });
}
function urlBase64ToUint8Array(base64String){
  var padding='='.repeat((4-base64String.length%4)%4);
  var base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  var raw=window.atob(base64);
  var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++){arr[i]=raw.charCodeAt(i);}
  return arr;
}
